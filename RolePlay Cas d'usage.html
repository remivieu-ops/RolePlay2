    --link: #8db0ff;
    --tint: #1c2640;
    --rail-tile: #17301f;
    --rail-tile-fg: #7fd6a4;
    --circle: #23252b;
    --prompt-bg: #1b1c21;
    --var-bg: #4a3a0a;
    --var-fg: #ffe08a;
    --fill-bg: #1d3566;
    --fill-fg: #bcd5ff;
    --proto-bg: #3a3010;
    --proto-fg: #ffd978;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    --a0: #1b2646; --b0: #26376b; --cb0: #22305a; --cf0: #a9c3ff;

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 60; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl { margin: 0; }
svg { display: block; flex: none; }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; }

/* Rail */
.rail { position: sticky; top: 0; align-self: start; height: 100vh; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 0 16px; overflow-y: auto; }

.company { flex: 0 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; border: 1px solid var(--primary); border-radius: 8px; padding: 0 14px; height: 48px; color: var(--primary); }

.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

var EXAMPLES = ROWS.map(function (r, i) {
  return {
    id: i + 1, ind: SECT[r[0]], type: r[1], dur: "3 min",
    title: r[2], role: (function (s) { s = s.replace(/^(un|une) /, ""); return s.charAt(0).toUpperCase() + s.slice(1); })(r[3]), goal: r[4].charAt(0).toUpperCase() + r[4].slice(1), scenario: r[5], avatar: r[6], skill: SKILLS[r[1]],
    prompt: STEM + r[3] + " de {entreprise} doit " + r[4] + ".",
    phrases: PHRASES[i]
  };
});


var INDUSTRIES = ["Services", "Santé", "Industrie", "Retail", "Banque & finance", "Formation"];
var ABBR = { "Services": "Sv", "Santé": "Sa", "Industrie": "In", "Retail": "Re", "Banque & finance": "Bf", "Formation": "Fo" };
var TYPES = ["Management", "Relation client", "Conformité & sécurité", "Communication interne"];
var LABELS = ["Ouvrir", "Explorer", "Conclure"];
var state = { ind: "Tous", type: "Tous", q: "", entreprise: "", open: 0 };
var lastFocus = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function byId(id) { return EXAMPLES.filter(function (e) { return e.id === id; })[0]; }
function tIdx(e) { return TYPES.indexOf(e.type); }

function plainPrompt(tpl) { return tpl.replace(/\{entreprise\}/g, state.entreprise.trim() || "[entreprise]"); }
function htmlPrompt(tpl) {
  return esc(tpl).replace(/\{entreprise\}/g, function () {
    var v = state.entreprise.trim();
    return v ? '<span class="f">' + esc(v) + "</span>" : '<span class="v">[entreprise]</span>';
  });
}

function matches(e) {
  if (state.ind !== "Tous" && e.ind !== state.ind) return false;
  if (state.type !== "Tous" && e.type !== state.type) return false;
  var q = state.q.trim().toLowerCase();
  if (q) {
    var hay = (e.title + " " + e.scenario + " " + e.avatar + " " + e.ind + " " + e.type + " " + e.phrases.join(" ")).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}

var QUOTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';

function renderFilters() {
  var pills = ["Tous"].concat(INDUSTRIES).map(function (n) {
    return '<button type="button" class="pill" data-ind="' + esc(n) + '" aria-pressed="' + (state.ind === n) + '">' + (n === "Tous" ? "Tous les secteurs" : esc(n)) + "</button>";
  }).join("");
  $("pills").innerHTML = pills;
  $("tiles").innerHTML = TYPES.map(function (n, i) {
    var c = EXAMPLES.filter(function (e) { return e.type === n; }).length;
    return '<button type="button" class="tile" data-piece data-type="' + esc(n) + '" aria-pressed="' + (state.type === n) + '"><span class="lab"><b>' + esc(n) + "</b><small>" + c + " cas</small></span></button>";
  }).join("");
}

function cardHtml(e) {
  var short = e.avatar.split(/[,.]/)[0];
  var n = tIdx(e);
  return '<button type="button" class="card t' + n + '" data-id="' + e.id + '">' +
    '<span class="card-top" style="background-size:' + (200 + (e.id * 37) % 140) + '%;background-position:' + ((e.id * 53) % 101) + '% ' + ((e.id * 29) % 101) + '%"></span>' +
    '<span class="card-body"><h3>' + esc(e.title) + '</h3><span class="chips"><span class="chip">' + esc(e.dur) + '</span><span class="chip tc">' + esc(e.type) + "</span></span></span>" +
    '<span class="card-foot"><span class="av">' + esc(short.charAt(0).toUpperCase()) + '</span><span class="av-name">' + esc(short) + '</span><span class="q">' + QUOTE + "3</span></span>" +
    "</button>";
}

function renderSections() {
  var list = EXAMPLES.filter(matches);
  if (!list.length) { $("sections").innerHTML = '<div class="empty">Aucun cas ne correspond. Changez de secteur ou effacez la recherche.</div>'; return; }
  var wide = state.ind === "Tous";
  $("sections").innerHTML = INDUSTRIES.map(function (ind) {
    var items = list.filter(function (e) { return e.ind === ind; });
    if (!items.length) return "";
    return '<section><div class="sec-head"><h2>' + esc(ind) + '</h2><span class="count">' + items.length + "</span>" +
      '<button type="button" class="seeall" data-see="' + (wide ? esc(ind) : "Tous") + '">' + (wide ? "Tout voir" : "Tous les secteurs") + "</button></div>" +
      '<div class="' + (wide ? "row-scroll" : "row-grid") + '">' + items.map(cardHtml).join("") + "</div></section>";
  }).join("");
}

function layoutMosaic() {
  var heroBox = document.querySelector(".hero"), bg = $("hero-bg"), tiles = $("tiles");
  if (!heroBox || !bg || !tiles) return;
  var narrow = heroBox.getBoundingClientRect().width < 1280;
  heroBox.classList.toggle("narrow", narrow);
  var hr = bg.getBoundingClientRect(), W = hr.width, H = hr.height;
  var phone = window.innerWidth <= 520;
  var sc = Math.max(W / 2000, H / 1050);
  if (phone) sc = Math.max(sc, 1.5 * W / 2000);
  var iw = 2000 * sc, ih = 1050 * sc;
  var logoH = 0.17 * ih;
  var cy = (narrow && !phone) ? H - logoH / 2 - 28 : H / 2;
  var top = Math.min(0, Math.max(H - ih, cy - 0.495 * ih));
  bg.style.backgroundSize = iw + "px " + ih + "px";
  bg.style.backgroundPosition = ((W - iw) / 2) + "px " + top + "px";
  var tr = tiles.getBoundingClientRect(), Wt = tr.width, Ht = tr.height;
  var s2 = Math.max(Wt / 2000, 2.5 * Ht / 1050), iw2 = 2000 * s2, ih2 = 1050 * s2;
  var l2 = (Wt - iw2) / 2, t2 = Ht - ih2;
  var list = tiles.querySelectorAll(".tile");
  for (var k = 0; k < list.length; k++) {
    var r = list[k].getBoundingClientRect();
    list[k].style.backgroundSize = iw2 + "px " + ih2 + "px";
    list[k].style.backgroundPosition = (l2 - (r.left - tr.left)) + "px " + (t2 - (r.top - tr.top)) + "px";
  }
}
function renderAll() { renderFilters(); renderSections(); layoutMosaic(); }
window.addEventListener("resize", layoutMosaic);
window.addEventListener("load", layoutMosaic);
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMosaic); } catch (err) {}

function drawerHtml(e) {
  return '<div class="drawer-head t' + tIdx(e) + '"><span class="chips"><span class="chip">' + esc(e.ind) + '</span><span class="chip">' + esc(e.dur) + '</span><span class="chip tc">' + esc(e.type) + "</span></span>" +
    '<button type="button" class="close" id="close" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
    '<div class="drawer-body"><h1>' + esc(e.title) + "</h1>" +
    '<p class="scenario">' + esc(e.scenario) + "</p>" +
    '<dl class="facts"><dt>Avatar</dt><dd>' + esc(e.avatar) + "</dd><dt>Rôle de l'apprenant</dt><dd>" + esc(e.role) + "</dd><dt>Objectif</dt><dd>" + esc(e.goal) + "</dd><dt>Compétence</dt><dd>" + esc(e.skill) + "</dd></dl>" +
    '<div class="dsec"><h2>Prompt à donner à RolePlay</h2><p>Les champs de RolePlay se remplissent à partir de cette phrase.</p><div class="prompt-box"><p class="prompt" id="prompt-text">' + htmlPrompt(e.prompt) + "</p></div></div>" +
    '<div class="dsec"><h2>Suggestion de phrases clefs</h2><p>Dans l\'ordre de la scène. Vous jouez l\'apprenant, l\'avatar répond.</p><ol class="lines">' +
    e.phrases.map(function (s, k) { return "<li><b>" + LABELS[k] + "</b>" + esc(s) + "</li>"; }).join("") + "</ol></div></div>" +
    '<div class="drawer-foot"><button type="button" class="copy" id="copy">Copier le prompt</button></div>';
}

function openCase(id) {
  var e = byId(id);
  if (!e) return;
  lastFocus = document.activeElement;
  state.open = id;
  $("drawer").innerHTML = drawerHtml(e);
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  try { document.body.style.overflow = "hidden"; } catch (err) {}
  try { location.hash = "cas-" + id; } catch (err) {}
  var c = $("close"); if (c) c.focus();
}
function closeCase() {
  state.open = 0;
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  try { document.body.style.overflow = ""; } catch (err) {}
  try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {}
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (err) {} }
}

function fallbackSelect(el) {
  try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (err) {}
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("button");
  if (ev.target === $("scrim")) { closeCase(); return; }
  if (!t) return;
  if (t.hasAttribute("data-ind")) { state.ind = state.ind === t.getAttribute("data-ind") && t.classList.contains("rail-btn") ? "Tous" : t.getAttribute("data-ind"); renderAll(); return; }
  if (t.hasAttribute("data-type")) { state.type = state.type === t.getAttribute("data-type") ? "Tous" : t.getAttribute("data-type"); renderAll(); return; }
  if (t.hasAttribute("data-see")) { state.ind = t.getAttribute("data-see"); renderAll(); window.scrollTo(0, 0); return; }
  if (t.id === "rail-home") { state.ind = "Tous"; state.type = "Tous"; state.q = ""; $("q").value = ""; renderAll(); window.scrollTo(0, 0); return; }
  if (t.classList.contains("card")) { openCase(Number(t.getAttribute("data-id"))); return; }
  if (t.id === "close") { closeCase(); return; }
  if (t.id === "copy") {
    var ex = byId(state.open);
    var text = plainPrompt(ex.prompt);
    var label = "Copier le prompt";
    var done = function () { t.textContent = "Copié"; t.classList.add("done"); setTimeout(function () { t.textContent = label; t.classList.remove("done"); }, 1800); };
    var failed = function () { fallbackSelect($("prompt-text")); t.textContent = "Texte sélectionné, faites Ctrl/Cmd+C"; setTimeout(function () { t.textContent = label; }, 3000); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, failed); } else { failed(); }
  }
});

document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && state.open) closeCase(); });

$("q").addEventListener("input", function (e) { state.q = e.target.value; renderSections(); });
$("v-entreprise").addEventListener("input", function (e) {
  state.entreprise = e.target.value;
  try { localStorage.setItem("rp-cas-usage-vars", JSON.stringify({ entreprise: state.entreprise })); } catch (err) {}
  var p = $("prompt-text"); var ex = byId(state.open);
  if (p && ex) p.innerHTML = htmlPrompt(ex.prompt);
});

try {
  var saved = JSON.parse(localStorage.getItem("rp-cas-usage-vars") || "null");
  if (saved && saved.entreprise) { state.entreprise = saved.entreprise; $("v-entreprise").value = state.entreprise; }
} catch (err) {}

renderAll();

try {
  var m = /^#cas-(\d+)$/.exec(location.hash || "");
  if (m && byId(Number(m[1]))) openCase(Number(m[1]));
} catch (err) {}
</script>
